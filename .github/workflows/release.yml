name: Release
concurrency:
  group: release-${{ github.event.inputs.tag || github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (for manual re-runs), e.g. v1.0.3 or v1.0.3-rc.1"
        required: true

permissions: {}

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/azure-wordpress   # confirm this is the namespace you pushed 1.0.2 to

jobs:
  build:
    name: Build image
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      resolved-tag: ${{ steps.resolve-tag.outputs.tag }}
      is-rc: ${{ steps.resolve-tag.outputs.is_rc }}
    steps:
      - name: Resolve tag
        id: resolve-tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${INPUT_TAG:-${RELEASE_TAG:-$REF_NAME}}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::Invalid or missing tag: '$TAG'"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-rc.* ]]; then
            echo "is_rc=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_rc=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.resolve-tag.outputs.tag }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Validation build only (nothing is pushed). Warms the cache for the publish job.
      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: src
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  push-to-dockerhub:
    name: Push to Docker Hub
    permissions:
      contents: read
      id-token: write
      attestations: write
    needs: build
    runs-on: ubuntu-latest
    environment: docker-publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.resolved-tag }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          # semver patterns skip {{major}}.{{minor}} and {{major}} on prereleases automatically
          tags: |
            type=semver,pattern={{version}},value=${{ needs.build.outputs.resolved-tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.build.outputs.resolved-tag }}
            type=semver,pattern={{major}},value=${{ needs.build.outputs.resolved-tag }}
            type=raw,value=latest,enable=${{ needs.build.outputs.is-rc != 'true' }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: src
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Generate build provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: index.docker.io/${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          predicate-type: "https://slsa.dev/provenance/v1"
          push-to-registry: true

  # Release Please only creates a GitHub release / notes for non-rc tags,
  # so an RC pushed by hand needs a manually generated prerelease.
  create-rc-release:
    name: Create RC GitHub release
    permissions:
      contents: write
    needs: [build, push-to-dockerhub]
    if: github.event_name == 'push' && needs.build.outputs.is-rc == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release for RC
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.resolved-tag }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --prerelease \
            --verify-tag