name: Publish image
concurrency:
  group: publish-${{ github.event.inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (for manual re-runs), e.g. v1.0.3"
        required: true

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Resolve tag
        id: resolve-tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          TAG="${INPUT_TAG:-$RELEASE_TAG}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid or missing tag: '$TAG'"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5   # pin to a SHA like your other workflow
        with:
          ref: ${{ steps.resolve-tag.outputs.tag }}

      - uses: docker/setup-qemu-action@v3      # only if you want arm64
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: imageleaf/azure-wordpress
          tags: |
            type=semver,pattern={{version}},value=${{ steps.resolve-tag.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.resolve-tag.outputs.tag }}
            type=semver,pattern={{major}},value=${{ steps.resolve-tag.outputs.tag }}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64   # add linux/arm64 if needed
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max